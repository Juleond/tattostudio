<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <title>Document</title>
</head>
<body>
    
    <!-- 1. Contenedor exterior para centrar y limitar el ancho -->
    <div class="justify-content-center row">
       
        <div class="col-md-6 col-12">
    
            <!-- 2. La Tarjeta visual que abraza todo el formulario -->       
            <div class="card shadow p-4">
                 
                <!--FORMULARIO DE REGISTRO -->
                <form id="formRegistro"  action="#" method="post" novalidate>
                    
                    <!-- fieldset de zona nombres-->
                    <fieldset class="border p-3 rounded mb-4">
                        
                        <legend class="float-none w-auto px-2 fs-7 fw-bold text-primary">
                            Datos de identificación
                        </legend>
                
                        <div class="row">
                            
                            <!-- NOMBRE COMPLETO-->       
                            <div class="mb-3 col-md-6">
                                <label for="name" class="form-label">
                                    Nombre completo *
                                </label>

                                <input 
                                    id="name" 
                                    name="name" 
                                    type="text" 
                                    class="form-control" 
                                    autocomplete="name" 
                                    placeholder="Ingresa tu nombre" 
                                    required
                                >
                                <div class="invalid-feedback">
                                    Ingresar el nombre completo.
                                </div>

                            </div>
                           
                            <!-- NOMBRE USUARIO-->
                            <div class="mb-3 col-md-6">
                                <label for="username" class="form-label">
                                    Nombre de Usuario *
                                </label>

                                <input 
                                    id="username" 
                                    name="username" 
                                    type="text" 
                                    class="form-control"  
                                    placeholder="Ingresa tu nombre de usuario" 
                                    required
                                >
                                <div class="invalid-feedback">
                                    Ingresar un nombre de usuario.
                                </div>
                            
                            </div>

                            <!-- CORREO ELECTRÓNICO-->
                            <div class="mb-3 col-md-12">
                                <label for="email" class="form-label">
                                    Correo Electrónico *
                                </label>

                                <input 
                                    id="email" 
                                    name="email" 
                                    type="email" 
                                    class="form-control" 
                                    autocomplete="email" 
                                    placeholder="Nombre@dominio.cl" 
                                    required
                                >
                            
                                <div class="invalid-feedback">
                                    Ingresar un correo con formato válido.
                                </div>
                            
                            </div>

                        </div>
                    </fieldset>
                
                    <!-- fieldset de zona de claves-->
                    <fieldset class="border p-2 rounded mb-4">
                        
                        <legend class="float-none w-auto px-2 fs-7 fw-bold text-primary">
                            Datos de seguridad
                        </legend>
                        
                        <div class="row">
                        <!-- CLAVE DE INGRESO-->
                            <div class="mb-3 col-md-6 col-12">
                                
                                <label for="password" class="form-label">
                                    Ingresa tu Contraseña *
                                </label>

                                <input 
                                    id="password" 
                                    name="password" 
                                    type="password" 
                                    class="form-control" 
                                    autocomplete="new-password" 
                                    placeholder="Ingresa tu contraseña" 
                                    required
                                >

                                <p class="form-text"> Entre 6 y 18 caracteres, al menos un número y una mayúscula. </p>

                                <div class="invalid-feedback">
                                    Revisar longitud, número y mayúscula.
                                </div>

                            </div>

                            <!-- REPETIR CLAVE DE INGRESO-->
                            <div class="mb-3 col-md-6 col-12">
                                <label for="confirmPassword" class="form-label">
                                    Confirmar Contraseña *
                                </label>

                                <input 
                                    id="confirmPassword" 
                                    name="confirmPassword" 
                                    type="password" 
                                    class="form-control" 
                                    autocomplete="new-password" 
                                    placeholder="Repite tu contraseña" 
                                    required
                                >

                                <div class="invalid-feedback">
                                    Las dos contraseñas deben coincidir.
                                </div>    

                            </div>
                        </div>
                    </fieldset>

                    <fieldset class="mb-4 rounded border p-2 ">
                        
                        <legend class="float-none w-auto px-2 fs-7 fw-bold text-primary">
                            Datos Adicionales
                        </legend>

                        <div class="row">
                            
                            <!-- FECHA DE NACIMIENTO--> 
                            <div class="mb-3 col-md-6 col-12">
                                <label for="birthdate" class="form-label">
                                    Fecha de nacimiento *
                                </label>

                                <input 
                                    id="birthdate" 
                                    name="birthdate"
                                    type="date"
                                    class="form-control"
                                    autocomplete="bday" 
                                    required
                                >        
                            </div>

                            <!-- DIRECCIÓN DE DESPACHO-->
                            <div class="mb-3 col-md-6 col-12">
                                <label for="dispatchAddress" class="form-label">
                                    Dirección de despacho
                                </label>

                                <textarea 
                                    id="dispatchAddress"
                                    name="dispatchAddress"
                                    class="form-control"
                                    autocomplete="street-address"
                                ></textarea>
                                    
                                
                            </div>

                        </div>

                    </fieldset>

                        
                    <div>
                        <button type="submit" class="btn btn-primary ms-3">Enviar</button>
                        <button type="reset" class="btn btn-secondary ms-2">Borrar</button>
                   
                    </div>
                    
                    
                </form>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/form-registro.js"></script>
</body>
</html>
